<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEK PWA</title><style>body{font-family:sans-serif;padding:16px}div{padding:12px;border-radius:12px;margin:8px 0;font-weight:700;font-size:13px}.ok{background:#dcfce7;color:#166534}.gagal{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}pre{background:#f1f5f9;padding:10px;white-space:pre-wrap;font-size:11px;border-radius:10px}</style></head>
<body><h3>Cek PWA ARFA</h3><div id="hasil"></div>
<img id="i192" src="img/icon-192.png" style="width:80px" onerror="this.style.display='none'">
<img id="i512" src="img/icon-512.png" style="width:80px" onerror="this.style.display='none'">
<script>
const h=document.getElementById("hasil");
function tulis(txt,ok){ const d=document.createElement("div"); d.className=ok?"ok":"gagal"; d.innerText=txt; h.appendChild(d); }
(async()=>{
  tulis("URL sekarang: "+location.href, true);
  // 1. Manifest
  try{ const r=await fetch("manifest.json"); const t=await r.text();
    if(!r.ok) tulis("❌ manifest.json GAGAL dibuka, status: "+r.status, false);
    else { tulis("✅ manifest.json ketemu", true);
      const pre=document.createElement("pre"); pre.innerText=t; h.appendChild(pre);
      try{ const j=JSON.parse(t); tulis("✅ manifest.json format JSON bener, icons: "+(j.icons||[]).length, true); }
      catch(e){ tulis("❌ manifest.json RUSAK, bukan JSON! Error: "+e.message, false); }
    }
  }catch(e){ tulis("❌ manifest.json ERROR: "+e.message, false); }
  // 2. SW
  try{ const r=await fetch("sw.js"); if(!r.ok) tulis("❌ sw.js GAGAL, status: "+r.status, false); else tulis("✅ sw.js ketemu, ukuran: "+(await r.text()).length+" huruf", true); }
  catch(e){ tulis("❌ sw.js ERROR: "+e.message, false); }
  // 3. Ikon
  for(const f of ["img/icon-192.png","img/icon-512.png"]){
    try{ const r=await fetch(f); if(!r.ok) tulis("❌ "+f+" GAGAL, status: "+r.status, false); else tulis("✅ "+f+" ketemu", true); }
    catch(e){ tulis("❌ "+f+" ERROR: "+e.message, false); }
  }
  // 4. SW terdaftar?
  if("serviceWorker" in navigator){ const reg=await navigator.serviceWorker.getRegistration(); tulis(reg?"✅ Service Worker TERDAFTAR: "+reg.scope:"❌ Service Worker BELUM terdaftar / GAGAL", !!reg); }
  else tulis("❌ Browser ini gak support Service Worker", false);
  // 5. Ukuran asli ikon
  setTimeout(()=>{ const a=document.getElementById("i192"), b=document.getElementById("i512"); tulis("Ukuran asli icon-192.png: "+a.naturalWidth+" x "+a.naturalHeight+" (harus 192 x 192)", a.naturalWidth===192); tulis("Ukuran asli icon-512.png: "+b.naturalWidth+" x "+b.naturalHeight+" (harus 512 x 512)", b.naturalWidth===512); },1000);
})();
</script></body></html>
